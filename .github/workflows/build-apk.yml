
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        working-directory: ./truffle mix apk
        run: npm install

      - name: Crear proyecto Android
        working-directory: ./truffle mix apk
        run: npx cap add android

      - name: Iconos y splash
        working-directory: ./truffle mix apk
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Licencias SDK
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Sincronizar Android
        working-directory: ./truffle mix apk
        run: npx cap sync android

      - name: Compilar APK
        working-directory: ./truffle mix apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TruffleMix-apk
          path: "truffle mix apk/android/app/build/outputs/apk/debug/app-debug.apk"
